name: Sugestao de Funcionalidade
description: Proponha novos registros estaduais, regras de validacao ou melhorias na interface.
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Contexto e Problema
      description: Qual necessidade contabil ou tecnica esta sugestao resolve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solucao Proposta
      description: Descreva como voce imagina o funcionamento no OpenSintegra.App ou OpenSintegra.Cli.
    validations:
      required: true
