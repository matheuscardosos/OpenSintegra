name: Sugestão de Funcionalidade
description: Proponha novos registros estaduais, regras de validação ou melhorias na interface.
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Contexto e Problema
      description: Qual necessidade contábil ou técnica esta sugestão resolve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solução Proposta
      description: Descreva como você imagina o funcionamento no OpenSintegra.App ou OpenSintegra.Cli.
    validations:
      required: true
